function setVB(b){
 var W=svg.clientWidth||800,H=svg.clientHeight||640,r=W/H,w=b[2],h=b[3],cx=b[0]+w/2,cy=b[1]+h/2;

}

 function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/380),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

}
